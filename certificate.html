<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certification Manager - Add & Manage Certificates</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <style>
        body {
            background: linear-gradient(135deg, #fff5eb 0%, #ffe8d9 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

/* Premium Navbar */
    .premium-nav {
      
       background: #ffffffdd;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 20px rgba(0,0,0,0.03);
      transition: all 0.3s;
    }
    
    .logo-text {
      font-size: 1.8rem;
      font-weight: 800;
      background: linear-gradient(135deg, #9B4B2C 0%, #CB7B3C 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.5px;
    }
    .brand-logo{
      max-height: 52px;
      width:auto;
      margin-right: 10px;
    }
    .nav-link-premium {
      font-weight: 500;
      color: #4A3729 !important;
      margin: 0 0.5rem;
      position: relative;
      transition: all 0.3s ease;
      font-size: 0.95rem;
      letter-spacing: 0.3px;
    }
    
    .nav-link-premium:hover {
      color: #CB7B3C !important;
    }
    
    .nav-link-premium::after {
      content: '';
      position: absolute;
      bottom: -5px;
      left: 0;
      width: 0;
      height: 2px;
      background: linear-gradient(90deg, #CB7B3C, #E8B56A);
      transition: width 0.3s ease;
    }
    
    .nav-link-premium:hover::after {
      width: 100%;
    }
    
    .cart-badge-premium {
      background: linear-gradient(135deg, #CB7B3C, #E8B56A);
      color: white;
      border-radius: 30px;
      padding: 0 8px;
      font-size: 0.7rem;
      margin-left: 6px;
      font-weight: 600;
    }
    

        
        /* Orange Theme */
        .orange-bg {
            background: linear-gradient(135deg, #187a41, #147b3095);
        }
        
        .orange-text {
            color: #187a41;
        }
        
        .orange-border {
            border-color: #187a41f !important;
        }
        
        .btn-orange {
            background: linear-gradient(135deg, #e67e22, #d35400);
            color: white;
            border: none;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .btn-orange:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(230, 126, 34, 0.3);
            color: white;
        }
        
        .btn-outline-orange {
            border: 2px solid #e67e22;
            color: #e67e22;
            background: white;
        }
        
        .btn-outline-orange:hover {
            background: #e67e22;
            color: white;
        }
        
        /* Certificate Cards */
        .cert-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            height: 100%;
        }
        
        .cert-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(230, 126, 34, 0.2);
        }
        
        .cert-image-container {
            width: 150px;
            height: 150px;
            margin: 0 auto 15px;
            border-radius: 50%;
            background: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 3px solid #e67e22;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .cert-image-container:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(230, 126, 34, 0.3);
        }
        
        .cert-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .image-placeholder {
            font-size: 3rem;
            color: #e67e22;
        }
        
        .cert-badge {
            display: inline-block;
            background: #e67e22;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 10px;
        }
        
        .cert-title {
            font-size: 1.3rem;
            font-weight: bold;
            color: #2c1810;
            margin-bottom: 10px;
        }
        
        .cert-description {
            color: #666;
            font-size: 0.9rem;
            line-height: 1.5;
            margin-bottom: 15px;
        }
        
        .cert-footer {
            border-top: 1px solid #eee;
            padding-top: 10px;
            font-size: 0.8rem;
            color: #999;
        }
        
        /* Admin Panel */
        .admin-panel {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }
        
        /* Floating Button */
        .fab {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #e67e22, #d35400);
            color: white;
            border: none;
            box-shadow: 0 5px 20px rgba(230, 126, 34, 0.4);
            z-index: 1000;
            transition: all 0.3s;
        }
        
        .fab:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 25px rgba(230, 126, 34, 0.5);
        }
        
        /* Preview Image */
        .image-preview {
            max-width: 100px;
            max-height: 100px;
            margin-top: 10px;
            border-radius: 10px;
            border: 2px solid #e67e22;
        }
        
        /* Delete Button */
        .delete-btn {
            background: none;
            border: none;
            color: #dc3545;
            cursor: pointer;
            transition: all 0.2s;
            padding: 5px 10px;
            border-radius: 5px;
        }
        
        .delete-btn:hover {
            background: #dc3545;
            color: white;
            transform: scale(1.05);
        }
        
        /* Toast */
        .toast-notification {
            position: fixed;
            bottom: 100px;
            right: 20px;
            z-index: 1100;
            animation: slideIn 0.3s ease;
        }
        
        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        
        /* Edit button */
        .edit-btn {
            background: none;
            border: none;
            color: #e67e22;
            cursor: pointer;
            padding: 5px 10px;
            border-radius: 5px;
            transition: all 0.2s;
        }
        
        .edit-btn:hover {
            background: #e67e22;
            color: white;
        }
        
        /* Header */
        .header {
            background: linear-gradient(135deg, #b37338, #11572ec8);
            color: white;
            padding: 40px 0;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>

<!-- Premium Navbar -->
<nav class="navbar navbar-expand-lg premium-nav fixed-top">
  <div class="container-fluid px-4 px-lg-5">
    <a class="navbar-brand logo-text" href="#"><img src="images/MeCeylon_LOGO-01-1-1024x542.jpg" class="brand-logo" style="color: #CB7B3C;"></img></a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#premiumNavbar">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="premiumNavbar">
      <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-center">
        <li class="nav-item"><a class="nav-link nav-link-premium" href="homee.html" data-page="home">Home</a></li>
        <li class="nav-item"><a class="nav-link nav-link-premium" href="#" data-page="products">Products</a></li>
        <li class="nav-item"><a class="nav-link nav-link-premium" href="#" data-page="about">About Us</a></li>
        <li class="nav-item"><a class="nav-link nav-link-premium" href="#" data-page="contact">Contact Us</a></li>
        <li class="nav-item"><a class="nav-link nav-link-premium" href="#" data-page="blogs">Blogs</a></li>
        <li class="nav-item"><a class="nav-link nav-link-premium" href="#" data-page="signup">Signup</a></li>
        <li class="nav-item"><a class="nav-link nav-link-premium" href="#" data-page="signin">Signin</a></li>
        <li class="nav-item">
          <a class="nav-link nav-link-premium" href="#" data-page="cart">
            <i class="fas fa-shopping-bag"></i> Cart <span id="cartCountNav" class="cart-badge-premium">0</span>
          </a>
        </li>
      </ul>
    </div>
  </div>
</nav>



<!-- Header -->
<div class="header">
    <div class="container text-center">
        <i class="bi bi-award fs-1"></i>
        <h1 class="display-4 fw-bold mt-2">Certification Manager</h1>
        <p class="lead">Add, edit, and manage your certifications with images</p>
        <button class="btn btn-light btn-lg rounded-pill px-4 mt-2" onclick="toggleAdminPanel()">
            <i class="bi bi-plus-circle"></i> Add New Certificate
        </button>
    </div>
</div>

<div class="container">
    <!-- Admin Panel (Hidden by default) -->
    <div id="adminPanel" style="display: none;">
        <div class="admin-panel">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h3 class="orange-text">
                    <i class="bi bi-shield-plus"></i> 
                    <span id="panelTitle">Add New Certificate</span>
                </h3>
                <button class="btn btn-secondary" onclick="toggleAdminPanel()">
                    <i class="bi bi-x-lg"></i> Close
                </button>
            </div>
            
            <form id="certificateForm">
                <input type="hidden" id="editId" value="">
                
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Certificate Title *</label>
                        <input type="text" class="form-control" id="title" required placeholder="e.g., ISO 22000:2018">
                    </div>
                    
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Badge Text</label>
                        <input type="text" class="form-control" id="badge" placeholder="e.g., International Standard">
                    </div>
                    
                    <div class="col-12 mb-3">
                        <label class="form-label fw-bold">Description</label>
                        <textarea class="form-control" id="description" rows="3" placeholder="Describe what this certification means..."></textarea>
                    </div>
                    
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Upload Image (from computer)</label>
                        <input type="file" class="form-control" id="imageFile" accept="image/*" onchange="previewImage(this)">
                        <small class="text-muted">Click to select image from your computer (JPG, PNG, GIF)</small>
                        <div id="imagePreview"></div>
                    </div>
                    
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Footer Text</label>
                        <input type="text" class="form-control" id="footer" placeholder="e.g., Internationally recognized">
                    </div>
                    
                    <div class="col-12">
                        <button type="submit" class="btn btn-orange px-4">
                            <i class="bi bi-save"></i> Save Certificate
                        </button>
                        <button type="button" class="btn btn-outline-orange px-4 ms-2" onclick="resetForm()">
                            <i class="bi bi-arrow-repeat"></i> Reset
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>
    
    <!-- Certificates Display Section -->
    <div class="mb-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="orange-text">
                <i class="bi bi-patch-check-fill"></i> My Certifications
            </h2>
            <span class="badge bg-orange fs-6" id="certCount">0</span>
        </div>
        <div class="row" id="certificatesContainer">
            <!-- Certificates will appear here -->
        </div>
    </div>
</div>

<!-- Floating Action Button -->
<button class="fab" onclick="toggleAdminPanel()" title="Add Certificate">
    <i class="bi bi-plus-lg fs-2"></i>
</button>

<script>
    // Load certificates from localStorage
    let certificates = [];
    
    // Load data on page start
    loadCertificates();
    
    function loadCertificates() {
        const stored = localStorage.getItem('myCertificates');
        if(stored) {
            certificates = JSON.parse(stored);
        } else {
            // Default certificates
            certificates = [
                {
                    id: '1',
                    title: 'ISO 22000:2018',
                    badge: 'International Standard',
                    description: 'Food Safety Management System - ensures complete control over food safety hazards from farm to fork.',
                    imageData: null,
                    footer: 'Internationally recognized · FSSC accredited'
                },
                {
                    id: '2',
                    title: 'HACCP Certification',
                    badge: 'Hazard Analysis',
                    description: 'Critical Control Point system identifying and managing biological, chemical, and physical risks.',
                    imageData: null,
                    footer: 'Codex Alimentarius compliant'
                },
                {
                    id: '3',
                    title: 'USDA Organic',
                    badge: 'Organic Certification',
                    description: '100% organic ingredients, no synthetic pesticides or GMOs.',
                    imageData: null,
                    footer: 'Certified organic · Non-GMO verified'
                }
            ];
            saveCertificates();
        }
        displayCertificates();
    }
    
    function saveCertificates() {
        localStorage.setItem('myCertificates', JSON.stringify(certificates));
        displayCertificates();
    }
    
    function displayCertificates() {
        const container = document.getElementById('certificatesContainer');
        const certCount = document.getElementById('certCount');
        
        if(!container) return;
        
        if(certificates.length === 0) {
            container.innerHTML = `
                <div class="col-12 text-center py-5">
                    <i class="bi bi-emoji-smile fs-1 text-muted"></i>
                    <p class="mt-3 text-muted">No certificates yet. Click the + button to add your first certification!</p>
                </div>
            `;
            if(certCount) certCount.textContent = '0';
            return;
        }
        
        if(certCount) certCount.textContent = certificates.length;
        
        let html = '';
        certificates.forEach(cert => {
            // Display image if exists
            let imageHtml = '';
            if(cert.imageData) {
                imageHtml = `<img src="${cert.imageData}" class="cert-image" alt="${cert.title}">`;
            } else {
                imageHtml = `<i class="bi bi-patch-check-fill image-placeholder"></i>`;
            }
            
            html += `
                <div class="col-md-6 col-lg-4">
                    <div class="cert-card">
                        <div class="cert-image-container" onclick="editCertificate('${cert.id}')">
                            ${imageHtml}
                        </div>
                        <div class="text-center">
                            <div class="cert-badge">${escapeHtml(cert.badge || 'Certificate')}</div>
                            <h3 class="cert-title">${escapeHtml(cert.title)}</h3>
                            <p class="cert-description">${escapeHtml(cert.description || 'No description provided.')}</p>
                            <div class="cert-footer">
                                <span><i class="bi bi-info-circle"></i> ${escapeHtml(cert.footer || 'Verified')}</span>
                                <div class="float-end">
                                    <button class="edit-btn" onclick="editCertificate('${cert.id}')" title="Edit">
                                        <i class="bi bi-pencil"></i>
                                    </button>
                                    <button class="delete-btn" onclick="deleteCertificate('${cert.id}')" title="Delete">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        });
        
        container.innerHTML = html;
    }
    
    // Preview image before upload
    function previewImage(input) {
        const previewDiv = document.getElementById('imagePreview');
        if(input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                previewDiv.innerHTML = `<img src="${e.target.result}" class="image-preview" alt="Preview">`;
            };
            reader.readAsDataURL(input.files[0]);
        } else {
            previewDiv.innerHTML = '';
        }
    }
    
    // Handle form submission
    document.getElementById('certificateForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const title = document.getElementById('title').value.trim();
        if(!title) {
            showToast('Please enter a certificate title', 'error');
            return;
        }
        
        const editId = document.getElementById('editId').value;
        const badge = document.getElementById('badge').value.trim();
        const description = document.getElementById('description').value.trim();
        const footer = document.getElementById('footer').value.trim();
        const imageFile = document.getElementById('imageFile').files[0];
        
        // Function to save certificate
        const saveCertificate = (imageData) => {
            const certData = {
                id: editId || Date.now().toString(),
                title: title,
                badge: badge,
                description: description,
                footer: footer,
                imageData: imageData || null
            };
            
            if(editId) {
                // Update existing
                const index = certificates.findIndex(c => c.id === editId);
                if(index !== -1) {
                    certificates[index] = certData;
                    showToast('Certificate updated successfully!', 'success');
                }
            } else {
                // Add new
                certificates.unshift(certData);
                showToast('Certificate added successfully!', 'success');
            }
            
            saveCertificates();
            resetForm();
            toggleAdminPanel();
        };
        
        // Handle image upload
        if(imageFile) {
            if(imageFile.size > 5 * 1024 * 1024) {
                showToast('Image too large! Max 5MB', 'error');
                return;
            }
            
            const reader = new FileReader();
            reader.onload = function(e) {
                saveCertificate(e.target.result);
            };
            reader.readAsDataURL(imageFile);
        } else {
            saveCertificate(null);
        }
    });
    
    function editCertificate(id) {
        const cert = certificates.find(c => c.id === id);
        if(cert) {
            document.getElementById('editId').value = cert.id;
            document.getElementById('title').value = cert.title;
            document.getElementById('badge').value = cert.badge || '';
            document.getElementById('description').value = cert.description || '';
            document.getElementById('footer').value = cert.footer || '';
            document.getElementById('imageFile').value = '';
            document.getElementById('imagePreview').innerHTML = '';
            
            if(cert.imageData) {
                document.getElementById('imagePreview').innerHTML = `<img src="${cert.imageData}" class="image-preview" alt="Preview">`;
            }
            
            document.getElementById('panelTitle').textContent = 'Edit Certificate';
            toggleAdminPanel();
        }
    }
    
    function deleteCertificate(id) {
        if(confirm('Are you sure you want to delete this certificate?')) {
            certificates = certificates.filter(c => c.id !== id);
            saveCertificates();
            showToast('Certificate deleted successfully!', 'success');
        }
    }
    
    function resetForm() {
        document.getElementById('certificateForm').reset();
        document.getElementById('editId').value = '';
        document.getElementById('imagePreview').innerHTML = '';
        document.getElementById('panelTitle').textContent = 'Add New Certificate';
    }
    
    function toggleAdminPanel() {
        const panel = document.getElementById('adminPanel');
        if(panel.style.display === 'none') {
            panel.style.display = 'block';
            resetForm();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        } else {
            panel.style.display = 'none';
        }
    }
    
    function showToast(message, type = 'success') {
        // Remove existing toasts
        const existing = document.querySelectorAll('.toast-notification');
        existing.forEach(t => t.remove());
        
        const toast = document.createElement('div');
        toast.className = 'toast-notification';
        
        const bgColor = type === 'success' ? 'linear-gradient(135deg, #e67e22, #d35400)' : 'linear-gradient(135deg, #dc3545, #c82333)';
        const icon = type === 'success' ? 'bi-check-circle-fill' : 'bi-exclamation-triangle-fill';
        
        toast.style.cssText = `
            background: ${bgColor};
            color: white;
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: 500;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            gap: 10px;
        `;
        
        toast.innerHTML = `<i class="bi ${icon} fs-5"></i> ${message}`;
        document.body.appendChild(toast);
        
        setTimeout(() => {
            toast.style.opacity = '0';
            toast.style.transition = 'opacity 0.3s';
            setTimeout(() => toast.remove(), 300);
        }, 3000);
    }
    
    function escapeHtml(str) {
        if(!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if(m === '&') return '&amp;';
            if(m === '<') return '&lt;';
            if(m === '>') return '&gt;';
            return m;
        });
    }
</script>

</body>
</html>
